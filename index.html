<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REVelation Slabs: Golden Odds Edition | DGW Collectibles</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #d4af37;
      --gold-light: #f4e4bc;
      --gold-dark: #b8962e;
      --bg-dark: #0a0a0a;
      --bg-card: #111111;
      --border: #2a2a2a;
      --text: #e8e8e8;
      --text-dim: #888888;
      --green: #4ade80;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bg-glow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .bg-glow::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: 
        radial-gradient(ellipse at 30% 20%, rgba(212, 175, 55, 0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 80%, rgba(212, 175, 55, 0.08) 0%, transparent 40%),
        radial-gradient(ellipse at 50% 50%, rgba(212, 175, 55, 0.05) 0%, transparent 60%);
      animation: slowPulse 12s ease-in-out infinite;
    }

    @keyframes slowPulse {
      0%, 100% { opacity: 0.6; transform: scale(1) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.05) rotate(1deg); }
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 600px;
      margin: 0 auto;
      padding: 60px 20px;
      text-align: center;
    }

    .header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(40px, 8vw, 64px);
      font-weight: 600;
      color: var(--gold);
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 20px;
      text-shadow: 0 0 60px rgba(212, 175, 55, 0.5);
      opacity: 0;
      animation: fadeInUp 0.8s ease forwards 0.2s, glowPulse 4s ease-in-out infinite 1s;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes glowPulse {
      0%, 100% { text-shadow: 0 0 60px rgba(212, 175, 55, 0.5); }
      50% { text-shadow: 0 0 80px rgba(212, 175, 55, 0.7), 0 0 120px rgba(212, 175, 55, 0.4); }
    }

    .header-subtitle {
      font-size: 14px;
      color: var(--text-dim);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 50px;
      opacity: 0;
      animation: fadeInUp 0.8s ease forwards 0.4s;
    }

    .value-box {
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.15) 0%, rgba(212, 175, 55, 0.05) 50%, var(--bg-card) 100%);
      border: 2px solid var(--gold);
      padding: 40px 30px;
      margin-bottom: 50px;
      position: relative;
      overflow: hidden;
      opacity: 0;
      animation: fadeInUp 0.8s ease forwards 0.6s;
    }

    .value-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(212, 175, 55, 0.1) 20%,
        rgba(255, 223, 100, 0.2) 50%,
        rgba(212, 175, 55, 0.1) 80%,
        transparent 100%
      );
      animation: shimmer 3s ease-in-out infinite;
    }

    @keyframes shimmer {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    .box-count {
      font-family: 'Cormorant Garamond', serif;
      font-size: 72px;
      font-weight: 600;
      color: var(--gold-light);
      line-height: 1;
      margin-bottom: 10px;
      position: relative;
      z-index: 1;
    }

    .box-label {
      font-size: 14px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text);
      margin-bottom: 30px;
      position: relative;
      z-index: 1;
    }

    .value-guarantee {
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--green);
      position: relative;
      z-index: 1;
      padding: 10px 20px;
      border: 1px solid var(--green);
      display: inline-block;
    }

    .price-section {
      margin-bottom: 40px;
      opacity: 0;
      animation: fadeInUp 0.8s ease forwards 0.8s;
    }

    .price {
      font-family: 'Cormorant Garamond', serif;
      font-size: 56px;
      font-weight: 600;
      color: var(--text);
    }

    .price-note {
      font-size: 12px;
      color: var(--text-dim);
      letter-spacing: 1px;
      margin-top: 8px;
    }

    .cta-section {
      opacity: 0;
      animation: fadeInUp 0.8s ease forwards 1s;
    }

    .cta-note {
      font-size: 12px;
      color: var(--text-dim);
      letter-spacing: 1px;
      margin-bottom: 25px;
    }

    .cta-button {
      display: inline-block;
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
      color: var(--bg-dark);
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-decoration: none;
      padding: 22px 70px;
      border: none;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
      animation: buttonPulse 2s ease-in-out infinite;
    }

    @keyframes buttonPulse {
      0%, 100% { box-shadow: 0 0 30px rgba(212, 175, 55, 0.3); }
      50% { box-shadow: 0 0 50px rgba(212, 175, 55, 0.5), 0 0 80px rgba(212, 175, 55, 0.2); }
    }

    .cta-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255, 255, 255, 0.3) 50%,
        transparent 100%
      );
      animation: buttonShimmer 2s ease-in-out infinite;
    }

    @keyframes buttonShimmer {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    .cta-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 40px rgba(212, 175, 55, 0.4);
    }

    .cta-subtext {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 20px;
      letter-spacing: 1px;
    }

    .footer {
      margin-top: 60px;
      padding-top: 30px;
      border-top: 1px solid var(--border);
      opacity: 0;
      animation: fadeInUp 0.8s ease forwards 1.2s;
    }

    .footer-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 16px;
      font-weight: 600;
      color: var(--gold);
      letter-spacing: 3px;
    }

    @media (max-width: 500px) {
      .box-count {
        font-size: 56px;
      }
      .price {
        font-size: 44px;
      }
      .cta-button {
        padding: 18px 50px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>

  <div class="container">
    <header class="header">
      <h1>REVelation Slabs</h1>
      <p class="header-subtitle">Golden Odds Edition</p>
    </header>

    <div class="value-box">
      <div class="box-label" style="margin-bottom: 15px;">Final</div>
      <div class="box-count">10</div>
      <div class="box-label">Slabs Available</div>
      <div class="value-guarantee" style="margin-top: 25px;">Total Card Value Higher Than Offer</div>
    </div>

    <div class="price-section">
      <div class="price">$750<span style="font-size: 20px; vertical-align: super;">*</span></div>
      <p class="price-note">Includes free shipping</p>
    </div>

    <section class="cta-section">
      <p class="cta-note">⚡ First to pay claims it — only one available</p>
      <a href="https://buy.stripe.com/3cI9AUc0v3PfafG0wV8ww00" class="cta-button">Claim Deal</a>
      <p class="cta-subtext">Secure checkout via Stripe</p>
    </section>

    <footer class="footer">
      <div class="footer-logo">DGW COLLECTIBLES</div>
      <p class="footnote" style="font-size: 10px; color: #666; margin-top: 20px; letter-spacing: 0.5px;">*Plus 3% credit card processing fee</p>
    </footer>
  </div>
</body>
</html>
